name: Release

# Pushing a version tag (e.g. v1.0.0) builds the Windows executable and publishes it
# as a GitHub Release. Running the workflow manually from the Actions tab builds the
# same zip as a downloadable artifact without publishing a release, for testing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check tag is on main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Releases must come from reviewed code, so the tagged commit has to be on main.
      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on main."
            exit 1
          fi

  build:
    needs: check-tag
    # Run after check-tag passes, or when it was skipped (manual runs).
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-build

      # Allows verification that the zip was built by this workflow from this repository.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ${{ needs.build.outputs.zip-name }}

      # The zip includes SpeechRecognition's FLAC encoder, which is GPLv2. The GPL asks
      # for its source to be offered from the same place as the program, so the
      # matching FLAC source is attached to every release. Keep the version in sync with
      # THIRD-PARTY-NOTICES.md when SpeechRecognition updates its bundled FLAC.
      - name: Download FLAC source
        env:
          FLAC_VERSION: "1.3.2"
          FLAC_SHA256: 91cfc3ed61dc40f47f050a109b08610667d73477af6ef36dcad31c31a4a8d53f
        run: |
          file="flac-$FLAC_VERSION.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$file" "https://downloads.xiph.org/releases/flac/$file"
          echo "$FLAC_SHA256  $file" | sha256sum --check
          echo "FLAC_SOURCE=$file" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ needs.build.outputs.zip-name }}
        run: |
          # Tags with a suffix (v1.0.0-beta.1) are published as pre-releases.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" "$FLAC_SOURCE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VRCTranslator $TAG" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"

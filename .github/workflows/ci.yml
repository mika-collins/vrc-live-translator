name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress PR run when a newer commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format
        if: ${{ !cancelled() }}
        run: ruff format --check --diff .

      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint

  build:
    name: Install & compile
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check dependency compatibility
        run: pip check

      - name: Compile all files
        run: python -m compileall -q .

      - name: Import app
        run: python -c "import app"

  typecheck:
    name: Type check
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Pyright needs the app's dependencies installed to check how they're used.
      - name: Install dependencies and dev tools
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependency compatibility
        run: pip check

      - name: Pyright
        run: pyright

  # Builds the executable the same way a release does, so a change or dependency
  # update that breaks packaging fails here instead of at release time. The zip is
  # attached to the run for reviewers to download and test.
  package:
    name: Package
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 7

  audit:
    name: Security audit
    # Windows so dependencies resolve the same way they do for users.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: pip-audit
        run: >-
          pip-audit
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-build.txt
          --desc

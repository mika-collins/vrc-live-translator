# Dependabot opens PRs to keep dependencies up to date.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # Python packages in requirements.txt, requirements-dev.txt and requirements-build.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Wait until a release is a week old, giving time for bad releases to be pulled.
    # Security updates ignore this and arrive right away.
    cooldown:
      default-days: 7
    # Bundle minor and patch bumps into one PR; major bumps still get their own.
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    # Gives PR titles "chore(deps)"
    commit-message:
      prefix: "chore(deps)"

  # Actions used in .github/workflows (e.g. actions/checkout).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
